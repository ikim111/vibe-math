<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 수학 활동</title>
<style>body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f4f5fb;color:#222}.w{max-width:640px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;text-align:center;margin:10px 0 18px}a.card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;text-decoration:none;color:#222;box-shadow:0 2px 8px #0001;border-left:8px solid #1565c0;min-height:44px}
.e{font-size:34px}.t{font-size:20px;font-weight:700}.s{font-size:15px;color:#666;margin-top:2px}</style></head><body><div class="w"><h1>📚 우리 반 수학 활동</h1><div id="list"></div></div>
<script>
// ▼ 활동 목록: 새 활동은 여기에 한 줄 더하기
const ACTIVITIES=[
  {emoji:"📐",title:"닮음비와 길이·둘레·넓이의 관계",sub:"슬라이더로 닮음비 바꿔 보기",file:"similar-ratio.html"},
  {emoji:"⛳",title:"확대 골프",sub:"k배 해서 공을 홀에 넣기",file:"zoom-golf.html"},
];
list.innerHTML=ACTIVITIES.map(a=>`<a class="card" href="${a.file}"><span class="e">${a.emoji}</span><span><div class="t">${a.title}</div><div class="s">${a.sub}</div></span></a>`).join("");
</script></body></html>
