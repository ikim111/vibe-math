<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>확대 골프 · 선생님 화면</title>
<style>body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#eef1f8;color:#222}.w{max-width:1100px;margin:0 auto;padding:16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{font-size:18px;padding:8px 14px;border-radius:10px;border:2px solid #1565c0;background:#fff;color:#1565c0;min-height:44px}
#sum{background:#fff;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:19px;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.st{background:#fff;border-radius:14px;padding:14px;border:3px solid #ddd}
.st.done{border-color:#2e7d32;background:#e8f5e9}.st.stop{border-color:#ef6c00;background:#fff3e0}.n{font-size:22px;font-weight:800}.m{color:#555;margin-top:6px;font-size:16px}.tag{font-weight:800}
.done .tag{color:#2e7d32}.stop .tag{color:#ef6c00}#who{color:#555}</style></head><body><div class="w">
<h1>⛳ 확대 골프 · 실시간 화면</h1>
<div class="top"><button id="login">구글로 로그인</button><span id="who"></span><select id="room"><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option></select></div>
<div id="sum">로그인하면 우리 반 학생이 보여요.</div><div id="grid"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAyThDaY7Ia5mpFyivvxUwBrkHB-BVQ8L8",authDomain:"vibe-math-demo.firebaseapp.com",databaseURL:"https://vibe-math-demo-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"vibe-math-demo",storageBucket:"vibe-math-demo.firebasestorage.app",messagingSenderId:"889681290441",appId:"1:889681290441:web:6e6c206be2da5515935918"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const STOP_MIN=3;let data={},off=null;
login.onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
onAuthStateChanged(auth,u=>{if(!u)return;login.style.display="none";who.textContent="로그인됨";watch()});
room.onchange=watch;
function watch(){if(off)off();off=onValue(ref(db,"golf/"+room.value),s=>{data=s.val()||{};draw()},e=>{sum.textContent="읽을 수 없어요: "+e.code})}
function draw(){const now=Date.now();const c={1:0,2:0,3:0,done:0,stop:0};
grid.innerHTML=Object.keys(data).sort((a,b)=>a-b).map(k=>{const d=data[k];const min=Math.floor((now-(d.at||now))/60000);
let cls="",tag=d.stage+"단계";if(d.done){cls="done";tag="끝 ✔";c.done++}else{c[d.stage]=(c[d.stage]||0)+1;if(min>=STOP_MIN){cls="stop";tag="⏸ "+min+"분째 멈춤";c.stop++}}
return `<div class="st ${cls}"><div class="n">${k}번 ${d.name||""}</div><div class="m"><span class="tag">${tag}</span></div><div class="m">점수 ${d.score} · 친 횟수 ${d.hits||0}</div><div class="m">마지막으로 친 지 ${min}분</div></div>`}).join("");
sum.textContent=`1단계 ${c[1]}명 · 2단계 ${c[2]}명 · 3단계 ${c[3]}명 · 끝 ${c.done}명 · 멈춤 ${c.stop}명`}
setInterval(draw,30000);
</script></body></html>
