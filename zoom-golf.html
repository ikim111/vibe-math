<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>확대 골프</title><style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#e8f5e9;color:#222}
.w{max-width:720px;margin:0 auto;padding:16px}h1{text-align:center;margin:8px 0}.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
svg{width:100%;background:#c8e6c9;border-radius:12px}.top{display:flex;justify-content:space-between;font-weight:700}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{font-size:22px;width:90px;padding:8px;border-radius:8px;border:2px solid #999;text-align:center}
button{font-size:20px;padding:10px 22px;border:0;border-radius:10px;background:#2e7d32;color:#fff;min-height:44px}#msg{font-size:18px;min-height:28px;margin-top:8px}
</style></head><body><div class="w"><h1>⛳ 확대 골프</h1>
<div class="c top"><span id="lv"></span><span id="tr"></span><span id="sc">점수 0</span></div>
<div class="c"><svg id="sv" viewBox="0 0 400 260"></svg></div>
<div class="c"><div class="ctl">공을 O에서 <input id="k" type="number" step="0.5" value="1"> 배 거리로 <button id="go">치기</button></div><div id="msg">k를 정해 공을 홀에 넣어 보세요. 기회는 한 단계에 3번!</div></div></div>
<script>
const KS=[[2,3],[0.5,1.5,2.5],[1.5,2.5,3,0.5]];let lv=0,tries=3,score=0,O,B,K;
function rnd(a,b){return a+Math.random()*(b-a)}
function setup(){const ks=KS[lv];do{K=ks[Math.floor(Math.random()*ks.length)]}while(K==1);const IN=p=>p[0]>25&&p[0]<375&&p[1]>25&&p[1]<235;let H;do{O=[rnd(30,370),rnd(30,230)];const ang=rnd(0,6.28),d=rnd(40,110);B=[O[0]+d*Math.cos(ang),O[1]+d*Math.sin(ang)];H=[O[0]+(B[0]-O[0])*K,O[1]+(B[1]-O[1])*K]}while(!(IN(B)&&IN(H)&&Math.hypot(H[0]-B[0],H[1]-B[1])>30));tries=3;document.getElementById('k').value=1;draw();}
function pt(p,c,r,t){return `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c}"/><text x="${p[0]+8}" y="${p[1]-8}" font-size="14">${t}</text>`}
function draw(ball){const H=[O[0]+(B[0]-O[0])*K,O[1]+(B[1]-O[1])*K];let s=pt(O,'#333',5,'O')+`<circle cx="${H[0]}" cy="${H[1]}" r="10" fill="#222"/><text x="${H[0]+12}" y="${H[1]}" font-size="14">홀</text>`+pt(B,'#fff',7,'공');
if(lv==0)s=`<line x1="${O[0]}" y1="${O[1]}" x2="${H[0]}" y2="${H[1]}" stroke="#666" stroke-dasharray="5 5"/>`+s;if(ball)s+=pt(ball,'#ffeb3b',7,'');sv.innerHTML=s;
lvEl.textContent=(lv+1)+'단계';tr.textContent='남은 기회 '+tries;sc.textContent='점수 '+score}
const lvEl=document.getElementById('lv');
go.onclick=()=>{const k=+document.getElementById('k').value;const ball=[O[0]+(B[0]-O[0])*k,O[1]+(B[1]-O[1])*k];draw(ball);
if(Math.abs(k-K)<0.05){score+=[100,90,80][3-tries];msg.textContent='🎉 홀인! '+(lv<2?'다음 단계로!':'모든 단계 성공!');if(lv<2){lv++;setTimeout(setup,1500)}}
else{tries--;msg.textContent=k>K?'공이 홀보다 O에서 멀어요.':'공이 홀보다 O에 가까워요.';if(tries==0){msg.textContent='3번 모두 놓쳤어요. 새 문제로 바꿀게요.';setTimeout(setup,2500)}else tr.textContent='남은 기회 '+tries}};
setup();
</script></body></html>
